name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC
            os: windows-latest
            # No -G: CMake picks the newest Visual Studio installed on the runner.
            # Pinning a year breaks whenever GitHub updates the runner image.
            configure: cmake -S . -B build -A x64
          - name: macOS Xcode
            # macos-14 is pinned with Xcode 15.4. The macos-latest image failed to compile
            # JUCE 7.0.9's juce_gui_basics.mm while building juceaide; the newer Xcode/SDK
            # is the suspected cause, not confirmed. If this pin fails, try JUCE 7.0.12.
            os: macos-15
            configure: cmake -S . -B build -G Xcode

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 15.4 (macOS)
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Configure
        run: ${{ matrix.configure }}

      # Build before testing: CTest needs the test executable to exist.
      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Run unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      # Only reached when the build and the tests pass. The run number keeps each run's artifact
      # distinct, so an older download cannot be mistaken for the current build.
      - name: Upload VST3 bundles
        uses: actions/upload-artifact@v4
        with:
          name: plugins-${{ runner.os }}-run${{ github.run_number }}
          path: build/plugins/*/*_artefacts/Release/VST3/*.vst3
          if-no-files-found: error

      # When the tests fail, keep CTest's log so the failure can be read from the run page.
      - name: Upload test log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ runner.os }}-run${{ github.run_number }}
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
