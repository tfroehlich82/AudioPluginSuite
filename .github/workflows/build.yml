name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC
            os: windows-latest
            # No -G: CMake picks the newest Visual Studio installed on the runner.
            # Pinning a year breaks whenever GitHub updates the runner image.
            configure: cmake -S . -B build -A x64
          - name: macOS Xcode
            os: macos-latest
            configure: cmake -S . -B build -G Xcode

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure
        run: ${{ matrix.configure }}

      # Build before testing: CTest needs the test executable to exist.
      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Run unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload VST3 bundles
        uses: actions/upload-artifact@v4
        with:
          name: plugins-${{ runner.os }}
          path: build/plugins/*/*_artefacts/Release/VST3/*.vst3
          if-no-files-found: error
